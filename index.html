(function(){let store={contacts:[],currentContactId:null,groups:[],words:[],emojis:['🌹','✨','🌙','💔','🔪','🥀','🖤','🤍','👀','💦'],stickers:[],globalSettings:{myName:'我',customCss:'',bgImage:'',myAvatar:'',callBg:'',pwaIcon:'',notificationSound:'',appName:''}};
let currentContact=null;let autoReplyTimer=null;let activeCardTab='word';let isContinuousMode=false;let isPartnerReplying=false;let partnerReplyTimeout=null;let bottomEmojiDeleteMode=false;let selectedWords=new Set(),selectedEmojis=new Set(),selectedStickers=new Set();let currentFilterGroupId='all';let replyToMsgId=null;let isCallActive=false;let isCallMinimized=false;let callInterval=null;let callSeconds=0;let keyboardWatchTimer=null;let isCallIncoming=false;let callIncomingTimer=null;let hasPlayedSound=false;
function playNotificationSound(){if(hasPlayedSound)return;hasPlayedSound=true;try{let soundData=store.globalSettings.notificationSound;if(soundData){let audio=new Audio(soundData);audio.play().catch(()=>{});return;}let AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;let ctx=new AudioCtx();let osc=ctx.createOscillator();let gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(587.33,ctx.currentTime);osc.frequency.setValueAtTime(880,ctx.currentTime+0.08);gain.gain.setValueAtTime(1.0,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.5);}catch(e){}}
function compressImage(file,callback){if(!file)return;let r=new FileReader();r.onload=function(e){let img=new Image();img.onload=function(){let canvas=document.createElement('canvas');let ctx=canvas.getContext('2d');let max=600;let w=img.width,h=img.height;if(w>max||h>max){let ratio=Math.min(max/w,max/h);w*=ratio;h*=ratio;}canvas.width=w;canvas.height=h;ctx.drawImage(img,0,0,w,h);callback(canvas.toDataURL('image/jpeg',0.8));};img.src=e.target.result;};r.readAsDataURL(file);}
function compressAudio(file,callback){let r=new FileReader();r.onload=function(e){callback(e.target.result);};r.readAsDataURL(file);}

function updateAppName(){let name=store.globalSettings.appName||'玫瑰·字卡';document.getElementById('page-title').textContent=name;let manifestLink=document.getElementById('manifest-link');if(manifestLink){let m={"name":name,"short_name":name,"display":"standalone","start_url":".","icons":[{"src":store.globalSettings.pwaIcon||'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Crect width="100" height="100" fill="%23fff"/%3E%3C/svg%3E',"sizes":"192x192","type":"image/png"}]};let b=new Blob([JSON.stringify(m)],{type:'application/json'});manifestLink.href=URL.createObjectURL(b);}}

function applyGlobalSettings(){document.getElementById('my-name-top').textContent=store.globalSettings.myName||'我';document.getElementById('set-my-name').value=store.globalSettings.myName||'我';document.getElementById('set-app-name').value=store.globalSettings.appName||'';if(store.globalSettings.myAvatar)document.getElementById('my-avatar-img').src=store.globalSettings.myAvatar;let style=document.getElementById('dynamic-css');if(!style){style=document.createElement('style');style.id='dynamic-css';document.head.appendChild(style);}style.innerHTML=store.globalSettings.customCss||'';document.getElementById('custom-css').value=store.globalSettings.customCss||'';let bg=document.getElementById('chat-bg-img');if(store.globalSettings.bgImage){bg.src=store.globalSettings.bgImage;bg.style.display='block';}else bg.style.display='none';updatePWAIcon();updateAppName();let sound=store.globalSettings.notificationSound;let preview=document.getElementById('notification-sound-preview');if(sound){preview.src=sound;preview.style.display='block';}else{preview.style.display='none';}}
function applyContactSettings(){if(!currentContact)return;document.getElementById('partner-name-top').textContent=currentContact.name;document.getElementById('set-partner-name').value=currentContact.name;document.getElementById('partner-avatar-img').src=currentContact.avatar||"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23fff'/%3E%3C/svg%3E";let s=currentContact.settings;document.getElementById('slider-min-delay').value=s.minDelay||3;document.getElementById('slider-min-delay-value').textContent=s.minDelay||3;document.getElementById('slider-max-delay').value=s.maxDelay||15;document.getElementById('slider-max-delay-value').textContent=s.maxDelay||15;document.getElementById('slider-min-count').value=s.minCount||1;document.getElementById('slider-min-count-value').textContent=s.minCount||1;document.getElementById('slider-max-count').value=s.maxCount||3;document.getElementById('slider-max-count-value').textContent=s.maxCount||3;document.getElementById('toggle-auto-message').checked=s.autoMessage!==false;document.getElementById('slider-auto-interval').value=s.autoInterval||10;document.getElementById('slider-auto-interval-value').textContent=s.autoInterval||10;}
function formatTime(ts){let d=new Date(ts);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}

function formatCallTime(sec){let m=Math.floor(sec/60).toString().padStart(2,'0');let s=(sec%60).toString().padStart(2,'0');return m+':'+s;}function renderChat(){let area=document.getElementById('chat-area');area.innerHTML='';if(!currentContact)return;currentContact.history.forEach(msg=>{if(msg.type==='typing')return;if(msg.type==='system_announce'){let div=document.createElement('div');div.style.cssText='text-align:center;color:#888;font-size:13px;padding:4px 0;background:transparent;';div.textContent=msg.content;area.appendChild(div);return;}let row=document.createElement('div');row.className='msg-row '+(msg.isSelf?'self':'partner');row.innerHTML=createMessageHTML(msg);area.appendChild(row);});area.scrollTop=area.scrollHeight;}
function createMessageHTML(msg){let isSelf=msg.isSelf;let ava=isSelf?document.getElementById('my-avatar-img').src:(currentContact.avatar||document.getElementById('partner-avatar-img').src);let inner='';if(msg.type==='qa'){let data=JSON.parse(msg.content);let optsHtml=data.options.map((opt,idx)=>{let sel=data.selectedIndex===idx?'selected':'';let dis=data.selectedIndex!==null?'disabled':'';return `<button class="qa-opt-btn ${sel} ${dis}" data-qa-id="${msg.id}" data-opt-idx="${idx}"><span>${idx+1}. ${opt}</span>${sel?'<span>✓</span>':''}</button>`;}).join('');inner=`<div class="qa-card"><div class="qa-title">${data.question}</div><div class="qa-options">${optsHtml}</div></div>`;}else if(msg.type==='image'||msg.type==='sticker'){inner=`<div class="bubble image-bubble"><img src="${msg.content}"></div>`;}else if(msg.type==='transfer'){let data;try{data=JSON.parse(msg.content);}catch(e){data={amount:msg.content,memo:'',status:'pending'};}let amount=data.amount||msg.content;let memo=data.memo||'';let status=data.status||'pending';let statusHtml='';let alignClass=isSelf?'left':'right';if(status==='pending'){statusHtml=`<div class="transfer-status ${alignClass}"><span class="status-badge pending">待收款</span><button class="collect-btn" data-msg-id="${msg.id}">收款</button></div>`;}else{statusHtml=`<div class="transfer-status ${alignClass}"><span class="status-badge received">已收款</span></div>`;}inner=`<div class="bubble transfer-bubble"><div class="transfer-row"><div class="transfer-icon">¥</div><div class="transfer-info"><span class="transfer-amount">¥${amount}</span>${memo?`<span class="transfer-memo">${memo}</span>`:`<span class="transfer-desc">${isSelf?'转账给对方':'收到转账'}</span>`}</div></div>${statusHtml}</div>`;}else{inner=`<div class="bubble">${msg.quote?`<div class="reply-preview">${msg.quote}</div>`:''}${msg.content.replace(/\\n/g,'<br>')}</div>`;}let menuHtml=`<div class="msg-actions-menu"><div class="action-item reply-action">回复</div><div class="action-item danger delete-action">删除</div></div>`;return `<div class="msg-header"><div class="mini-avatar"><img src="${ava}"></div></div><div class="msg-content" data-msg-id="${msg.id}">${inner}${menuHtml}<div class="msg-time">${formatTime(msg.timestamp)}${isSelf?'<span class="read-icon">已读</span>':''}</div></div>`;}
function handleQASelect(msgId,forceIndex){let msg=currentContact.history.find(m=>m.id===msgId);if(!msg||msg.type!=='qa')return;let data=JSON.parse(msg.content);if(data.selectedIndex!==null)return;let chosenIdx=(forceIndex!==undefined&&forceIndex!==null)?forceIndex:Math.floor(Math.random()*data.options.length);data.selectedIndex=chosenIdx;msg.content=JSON.stringify(data);saveData();renderChat();let chosenText=data.options[chosenIdx];let sysMsg={id:'sys_'+Date.now(),content:`Ta选择了 ${chosenIdx+1}.${chosenText}`,type:'system_announce',isSelf:false,timestamp:Date.now()};currentContact.history.push(sysMsg);saveData();renderChat();}
function sendMessage(content,type,isSelf,quoteText,extra){let msg={id:'m_'+Date.now(),content,type,isSelf,timestamp:Date.now(),quote:quoteText||null};if(extra)Object.assign(msg,extra);currentContact.history.push(msg);saveData();renderChat();if(!isSelf&&!hasPlayedSound)playNotificationSound();if(type==='qa'&&isSelf){setTimeout(()=>{handleQASelect(msg.id);},3000);}if(type==='transfer'&&isSelf){let msgId=msg.id;setTimeout(()=>{let target=currentContact.history.find(m=>m.id===msgId);if(target&&target.type==='transfer'){try{let d=JSON.parse(target.content);if(d.status==='pending'){d.status='received';target.content=JSON.stringify(d);saveData();renderChat();currentContact.history.push({id:'s_'+Date.now(),content:'对方已收款',type:'system_announce',isSelf:false,timestamp:Date.now()});saveData();renderChat();}}catch(e){}}},3000);}}function showTypingIndicator(show){let area=document.getElementById('chat-area');let exist=area.querySelector('.typing-row');if(exist)exist.remove();if(show){let row=document.createElement('div');row.className='msg-row partner typing-row';row.innerHTML=`<div class="msg-header"><div class="mini-avatar"><img src="${currentContact.avatar||document.getElementById('partner-avatar-img').src}"></div></div><div class="msg-content"><div class="typing-indicator"><span>正在输入中</span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;area.appendChild(row);area.scrollTop=area.scrollHeight;}}
function triggerPartnerReply(){if(!currentContact||isPartnerReplying)return;abortPartnerReply();isPartnerReplying=true;hasPlayedSound=false;let s=currentContact.settings;let count=Math.floor(Math.random()*(s.maxCount-s.minCount+1)+s.minCount);let sent=0;function sendNext(){if(!isPartnerReplying)return;if(sent>=count){isPartnerReplying=false;return;}let rnd=Math.random();if(rnd<0.05&&!isCallActive&&!isCallMinimized&&!isCallIncoming){let trArr=[520,1314,5201314,666,99.99];let amt=trArr[Math.floor(Math.random()*trArr.length)];sendMessage(JSON.stringify({amount:amt,memo:'转账给对方',status:'pending'}),'transfer',false);sent++;setTimeout(sendNext,50);return;}if(rnd>=0.05&&rnd<0.10&&!isCallActive&&!isCallMinimized&&!isCallIncoming){isCallIncoming=true;openCallUI(true);callIncomingTimer=setTimeout(()=>{if(isCallIncoming){isCallIncoming=false;sendMessage('[语音通话] 对方未接听，已取消','text',false);}},18000);sent++;setTimeout(sendNext,50);return;}showTypingIndicator(true);let delay=Math.floor(Math.random()*(s.maxDelay-s.minDelay+1)+s.minDelay)*1000;partnerReplyTimeout=setTimeout(()=>{if(!isPartnerReplying)return;showTypingIndicator(false);let words=store.words.length>0?store.words:[{text:'...'}];let emojis=store.emojis.length>0?store.emojis:['...'];let stickers=store.stickers;let word=words[Math.floor(Math.random()*words.length)].text;let emoji=emojis[Math.floor(Math.random()*emojis.length)];let sticker=stickers.length>0?stickers[Math.floor(Math.random()*stickers.length)]:null;let quote=null;if(Math.random()<0.15&&currentContact.history.length>0){let last=currentContact.history.filter(m=>m.isSelf).pop();if(last)quote=last.content.substring(0,20)+'...';}if(sticker&&Math.random()<0.25){sendMessage(sticker,'sticker',false,quote);}else{let final=word;if(Math.random()<0.15)final=word+' '+emoji;sendMessage(final,'text',false,quote);}sent++;setTimeout(sendNext,50);},delay);}sendNext();}
function abortPartnerReply(){if(partnerReplyTimeout){clearTimeout(partnerReplyTimeout);partnerReplyTimeout=null;}isPartnerReplying=false;showTypingIndicator(false);}
function startAutoReplyLoop(){if(autoReplyTimer)clearInterval(autoReplyTimer);if(!currentContact||!currentContact.settings.autoMessage)return;let interval=(currentContact.settings.autoInterval||10)*60*1000;autoReplyTimer=setInterval(()=>{if(!isContinuousMode)triggerPartnerReply();},interval);}function adjustForKeyboard(){let app=document.getElementById('app');let chatArea=document.getElementById('chat-area');if(!app||!chatArea)return;let viewHeight=window.visualViewport?window.visualViewport.height:window.innerHeight;let windowHeight=window.innerHeight;if(viewHeight<windowHeight){app.style.height=viewHeight+'px';}else{app.style.height='100dvh';}chatArea.scrollTop=chatArea.scrollHeight;}

function startCallTimer(){document.getElementById('call-actions-incoming').style.display='none';document.getElementById('call-actions-active').style.display='flex';callSeconds=0;document.getElementById('call-status').textContent='00:00';document.getElementById('minimized-call-time').textContent='00:00';clearInterval(callInterval);callInterval=setInterval(()=>{callSeconds++;let t=formatCallTime(callSeconds);document.getElementById('call-status').textContent=t;document.getElementById('minimized-call-time').textContent=t;},1000);}
function endCall(){isCallActive=false;isCallIncoming=false;clearInterval(callInterval);if(callIncomingTimer){clearTimeout(callIncomingTimer);callIncomingTimer=null;}document.getElementById('voice-call-overlay').style.display='none';document.getElementById('minimized-call-widget').style.display='none';let msg=callSeconds>0?'[语音通话] 通话时长 '+formatCallTime(callSeconds):'[语音通话] 已取消';sendMessage(msg,'text',true);callSeconds=0;}
function bindEvents(){if(window.visualViewport){window.visualViewport.addEventListener('resize',adjustForKeyboard);window.visualViewport.addEventListener('scroll',()=>window.scrollTo(0,0));}window.addEventListener('resize',adjustForKeyboard);window.addEventListener('orientationchange',adjustForKeyboard);let msgInput=document.getElementById('msg-input');msgInput.addEventListener('focus',()=>{startKeyboardWatch();setTimeout(adjustForKeyboard,100);setTimeout(adjustForKeyboard,300);setTimeout(()=>{let area=document.getElementById('chat-area');if(area)area.scrollTop=area.scrollHeight;},350);});msgInput.addEventListener('blur',()=>{setTimeout(adjustForKeyboard,150);setTimeout(adjustForKeyboard,400);});msgInput.addEventListener('keydown',function(e){if(e.key==='Enter'||e.keyCode===13){if(!e.shiftKey){e.preventDefault();document.getElementById('send-btn').click();}}});document.getElementById('btn-more-actions').onclick=()=>{let p=document.getElementById('more-actions-panel');p.style.display=p.style.display==='none'?'flex':'none';};

}
function renderContactsList(){let c=document.getElementById('contacts-list');c.innerHTML='';store.contacts.forEach(con=>{let d=document.createElement('div');d.style.display='flex';d.style.justifyContent='space-between';d.style.alignItems='center';d.style.padding='6px 8px';d.style.border='1px solid '+(con.id===store.currentContactId?'#000':'transparent');d.style.background=con.id===store.currentContactId?'#eee':'transparent';d.style.cursor='pointer';d.innerHTML=`<span>${con.name}</span><span style="font-size:12px;color:#666;">${con.id===store.currentContactId?'当前':''}</span>`;d.onclick=()=>{store.currentContactId=con.id;currentContact=con;saveData();applyContactSettings();renderChat();renderContactsList();startAutoReplyLoop();};c.appendChild(d);});}
function renderManageGroupsSelect(){let s=document.getElementById('card-group-select');s.innerHTML='';let f=document.getElementById('word-list-filter');f.innerHTML='';let allOpt=document.createElement('option');allOpt.value='all';allOpt.textContent='全部分组';s.appendChild(allOpt);let allF=document.createElement('option');allF.value='all';allF.textContent='全部分组';f.appendChild(allF);store.groups.forEach(g=>{let o=document.createElement('option');o.value=g.id;o.textContent=g.name;s.appendChild(o);let of=document.createElement('option');of.value=g.id;of.textContent=g.name;f.appendChild(of);});f.value=currentFilterGroupId;let delBtn=document.getElementById('btn-delete-group');delBtn.style.display=(s.value!=='all')?'inline-block':'none';s.onchange=function(){delBtn.style.display=(this.value!=='all')?'inline-block':'none';};}
function renderManageWords(){let container=document.getElementById('card-list-container');container.innerHTML='';let list=currentFilterGroupId==='all'?store.words:store.words.filter(w=>w.groupId===currentFilterGroupId);list.forEach(w=>{let gname=store.groups.find(g=>g.id===w.groupId)?.name||'全部分组';let isSel=selectedWords.has(w.id);let item=document.createElement('div');item.className='card-item'+(isSel?' selected':'');item.innerHTML=`<input type="checkbox" class="card-check" ${isSel?'checked':''} data-id="${w.id}"><span class="group-tag">${gname}</span><span class="card-text">${w.text}</span><span class="del-icon" data-id="${w.id}">✕</span>`;container.appendChild(item);});container.querySelectorAll('.card-check').forEach(chk=>chk.onchange=function(){if(this.checked)selectedWords.add(this.dataset.id);else selectedWords.delete(this.dataset.id);renderManageWords();});container.querySelectorAll('.del-icon').forEach(del=>del.onclick=function(e){let id=this.dataset.id;if(confirm('删除此字卡？')){store.words=store.words.filter(w=>w.id!==id);selectedWords.delete(id);saveData();renderManageWords();toast('已删除');}});}
function renderManageEmojis(){let c=document.getElementById('emoji-list-container');c.innerHTML='';store.emojis.forEach((em,i)=>{let card=document.createElement('div');card.className='emoji-card'+(selectedEmojis.has(i)?' selected':'');card.innerHTML=`<span>${em}</span>`;card.onclick=()=>{if(selectedEmojis.has(i))selectedEmojis.delete(i);else selectedEmojis.add(i);renderManageEmojis();};c.appendChild(card);});}
function renderManageStickers(){let c=document.getElementById('sticker-list-container');c.innerHTML='';store.stickers.forEach((b64,i)=>{let card=document.createElement('div');card.className='sticker-card'+(selectedStickers.has(i)?' selected':'');card.innerHTML=`<img src="${b64}">`;card.onclick=()=>{if(selectedStickers.has(i))selectedStickers.delete(i);else selectedStickers.add(i);renderManageStickers();};c.appendChild(card);});}
function renderBottomStickerPanel(){let grid=document.getElementById('emoji-grid');grid.innerHTML='';grid.className=bottomEmojiDeleteMode?'delete-mode':'';store.stickers.forEach((b64,i)=>{let wrap=document.createElement('div');wrap.className='emoji-sticker-wrap';let img=document.createElement('img');img.src=b64;let badge=document.createElement('div');badge.className='del-badge';badge.textContent='×';wrap.appendChild(img);wrap.appendChild(badge);wrap.onclick=()=>{if(bottomEmojiDeleteMode){store.stickers.splice(i,1);saveData();renderBottomStickerPanel();renderManageStickers();}else{document.querySelectorAll('#emoji-grid .selected').forEach(el=>el.classList.remove('selected'));wrap.classList.add('selected');sendMessage(b64,'sticker',true);toggleOverlay('emoji-panel-overlay',false);if(!isContinuousMode)triggerPartnerReply();}};grid.appendChild(wrap);});}
function toggleOverlay(id,show){document.getElementById(id).classList.toggle('show',show);}
function init(){loadData();ensureContact();applyGlobalSettings();applyContactSettings();renderChat();renderContactsList();startAutoReplyLoop();bindEvents();adjustForKeyboard();document.getElementById('more-actions-panel').style.display='none';}
init();})();</script></body></html>
